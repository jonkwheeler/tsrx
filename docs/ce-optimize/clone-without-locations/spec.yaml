name: clone-without-locations
description: >-
  Reduce @tsrx/core AST cloning time when callers explicitly discard source
  locations, without changing clone semantics or the location-preserving path.

metric:
  primary:
    type: hard
    name: clone_without_locations_ms
    direction: minimize
  objectives:
    - name: clone_with_locations_ms
      type: hard
      role: required
      direction: minimize
      max_regression:
        type: relative
        value: 0.05
  degenerate_gates:
    - name: semantic_ok
      check: "== 1"
      description: The clone is structurally independent and leaves the source unchanged.
    - name: locations_removed
      check: "== 1"
      description: The no-location clone removes start, end, and loc recursively.
  diagnostics:
    - name: ast_objects

measurement:
  command: node --expose-gc docs/ce-optimize/clone-without-locations/measure.mjs
  working_directory: .
  timeout_seconds: 120
  output_format: json
  stability:
    mode: repeat
    repeat_count: 5
    aggregation: median
    noise_threshold: 0.05
    comparison:
      method: relative
      relative_threshold: 0.05

scope:
  mutable:
    - packages/tsrx/src/transform/jsx/ast-builders.js
    - packages/tsrx/tests/utils/clone-ast-node.test.js
  immutable:
    - docs/ce-optimize/clone-without-locations/measure.mjs
    - packages/tsrx/types/
    - pnpm-lock.yaml

execution:
  mode: serial
  backend: worktree
  max_concurrent: 1

parallel:
  port_strategy: none
  shared_files: []
  exclusive_resources: []

dependencies:
  approved: []

constraints:
  - Add no dependencies.
  - Preserve the public clone_ast_node API and the location-preserving code path.
  - Preserve recursive metadata-copy behavior, key order, and source immutability.
  - Keep only changes that pass the focused tests and the full @tsrx/core test project.

stopping:
  max_iterations: 3
  max_hours: 1
  plateau_iterations: 2
  target_reached: false

max_runner_up_merges_per_batch: 0
