on: workflow_dispatch

name: Publish VSC Extension (Manual)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install deps w/ pnpm
        working-directory: ./packages/vscode-plugin
        run: pnpm install --frozen-lockfile

      - name: Build VSIX
        working-directory: ./packages/vscode-plugin
        run: pnpm run build-and-package

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vscode-plugin VSIX
          path: ./packages/vscode-plugin/vscode-plugin.vsix
          if-no-files-found: error

  publish-vsm:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=TSRX.tsrx-vscode-plugin
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download VSIX
        uses: actions/download-artifact@v7
        with:
          name: vscode-plugin VSIX
          path: ./packages/vscode-plugin

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install deps w/ pnpm
        run: pnpm install --frozen-lockfile

      - name: Validate Microsoft Entra configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$AZURE_CLIENT_ID" || { echo "Missing vscode-marketplace environment variable: AZURE_CLIENT_ID" >&2; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "Missing vscode-marketplace environment variable: AZURE_TENANT_ID" >&2; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "Missing vscode-marketplace environment variable: AZURE_SUBSCRIPTION_ID" >&2; exit 1; }

      - name: Log in to Microsoft Azure with GitHub OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to VSM
        working-directory: ./packages/vscode-plugin
        run: pnpm exec vsce publish --azure-credential -i *.vsix

  publish-ovsx:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download VSIX
        uses: actions/download-artifact@v7
        with:
          name: vscode-plugin VSIX
          path: ./packages/vscode-plugin

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install deps w/ pnpm
        run: pnpm install --frozen-lockfile

      - name: Publish to OVSX
        working-directory: ./packages/vscode-plugin
        run: pnpm exec ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
