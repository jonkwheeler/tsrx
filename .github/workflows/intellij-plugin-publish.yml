name: Publish IntelliJ Plugin

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full SHA of the current main commit to release
        required: true
        type: string
      mode:
        description: Stage a signed first-submission artifact or publish an existing listing update
        required: true
        default: stage
        type: choice
        options:
          - stage
          - publish

permissions:
  actions: read
  contents: read

concurrency:
  group: intellij-plugin-publish
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve protected release commit
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      plugin-version: ${{ steps.versions.outputs.plugin-version }}
      lsp-version: ${{ steps.versions.outputs.lsp-version }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact current main commit
        id: commit
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from the main branch." >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full 40-character commit SHA." >&2
            exit 1
          fi

          git fetch --force --no-tags origin refs/heads/main
          resolved_commit="$(git rev-parse HEAD^{commit})"
          main_commit="$(git rev-parse FETCH_HEAD^{commit})"
          if [[ "$resolved_commit" != "$REQUESTED_REVISION" || "$resolved_commit" != "$main_commit" ]]; then
            echo "revision must resolve to the current main head." >&2
            exit 1
          fi
          echo "commit=$resolved_commit" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Verify synchronized versions
        run: node scripts/sync-intellij-plugin-version.js --check

      - name: Record release versions
        id: versions
        run: |
          plugin_version="$(node -p "require('./packages/intellij-plugin/package.json').version")"
          lsp_version="$(node -p "require('./packages/language-server/package.json').version")"
          echo "plugin-version=$plugin_version" >> "$GITHUB_OUTPUT"
          echo "lsp-version=$lsp_version" >> "$GITHUB_OUTPUT"

      - name: Verify the published language-server package
        run: node packages/intellij-plugin/scripts/verify-language-server-release.mjs

      - name: Verify Marketplace listing state
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: node packages/intellij-plugin/scripts/verify-marketplace-state.mjs "$RELEASE_MODE"

  verification:
    name: Verify release archive
    needs: resolve
    uses: ./.github/workflows/intellij-plugin.yml
    with:
      revision: ${{ needs.resolve.outputs.commit }}

  release:
    name: ${{ inputs.mode == 'publish' && 'Publish signed update' || 'Stage signed archive' }}
    needs: [resolve, verification]
    runs-on: ubuntu-latest
    environment: jetbrains-marketplace
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Download verified unsigned archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: intellij-plugin-unsigned
          path: release/unsigned

      - name: Prove the archive is reproducible
        id: unsigned
        run: |
          mapfile -t verified_archives < <(find release/unsigned -maxdepth 1 -type f -name '*.zip')
          if [[ "${#verified_archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one verified unsigned archive." >&2
            exit 1
          fi

          packages/intellij-plugin/gradlew -p packages/intellij-plugin buildPlugin
          mapfile -t rebuilt_archives < <(find packages/intellij-plugin/build/distributions -maxdepth 1 -type f -name '*.zip' ! -name '*-signed.zip')
          if [[ "${#rebuilt_archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one rebuilt unsigned archive." >&2
            exit 1
          fi
          cmp -- "${verified_archives[0]}" "${rebuilt_archives[0]}"

          archive="$(realpath "${verified_archives[0]}")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Validate signing credentials
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          for required in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "Missing jetbrains-marketplace secret: $required" >&2
              exit 1
            fi
          done

      - name: Sign the verified archive
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          RELEASE_ARCHIVE: ${{ steps.unsigned.outputs.archive }}
        run: >-
          packages/intellij-plugin/gradlew -p packages/intellij-plugin signPlugin
          "-PreleaseArchiveFile=$RELEASE_ARCHIVE"

      - name: Locate signed archive
        id: signed
        run: |
          mapfile -t signed_archives < <(find packages/intellij-plugin/build/distributions -maxdepth 1 -type f -name '*-signed.zip')
          if [[ "${#signed_archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one signed archive." >&2
            exit 1
          fi
          archive="$(realpath "${signed_archives[0]}")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify plugin signature
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          certificate_file="$RUNNER_TEMP/tsrx-certificate-chain.crt"
          trap 'rm -f -- "$certificate_file"' EXIT
          umask 077
          if [[ "$CERTIFICATE_CHAIN" == '-----BEGIN CERTIFICATE-----'* ]]; then
            printf '%s\n' "$CERTIFICATE_CHAIN" > "$certificate_file"
          else
            printf '%s' "$CERTIFICATE_CHAIN" | base64 --decode > "$certificate_file"
          fi
          unset CERTIFICATE_CHAIN
          packages/intellij-plugin/gradlew -p packages/intellij-plugin verifyPluginSignature \
            "-PcertificateChainFile=$certificate_file"

      - name: Record release evidence
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
          PLUGIN_VERSION: ${{ needs.resolve.outputs.plugin-version }}
          LSP_VERSION: ${{ needs.resolve.outputs.lsp-version }}
          MODE: ${{ inputs.mode }}
          UNSIGNED_ARCHIVE: ${{ steps.unsigned.outputs.archive }}
          SIGNED_ARCHIVE: ${{ steps.signed.outputs.archive }}
        run: |
          mkdir -p release/evidence
          {
            echo "commit=$COMMIT"
            echo "pluginVersion=$PLUGIN_VERSION"
            echo "tsrxLspVersion=$LSP_VERSION"
            echo "mode=$MODE"
          } > release/evidence/release.txt
          sha256sum "$UNSIGNED_ARCHIVE" "$SIGNED_ARCHIVE" > release/evidence/SHA256SUMS
          node packages/intellij-plugin/scripts/verification-matrix.mjs > release/evidence/verification-matrix.json

      - name: Publish existing Marketplace listing update
        if: inputs.mode == 'publish'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          SIGNED_ARCHIVE: ${{ steps.signed.outputs.archive }}
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo "Missing jetbrains-marketplace secret: PUBLISH_TOKEN" >&2
            exit 1
          fi
          packages/intellij-plugin/gradlew -p packages/intellij-plugin publishPlugin \
            "-PreleaseSignedArchiveFile=$SIGNED_ARCHIVE"

      - name: Upload signed archive and evidence
        if: always() && steps.signed.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-plugin-${{ inputs.mode }}-${{ needs.resolve.outputs.commit }}
          path: |
            ${{ steps.signed.outputs.archive }}
            release/evidence
          if-no-files-found: error
          retention-days: 90
