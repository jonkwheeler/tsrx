# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
kotlin.stdlib.default.dependency=false

# IntelliJ Platform build used to compile and run platform tests.
targetPlatformVersion=2025.2.4

# Oldest 252-series release verified for the WebStorm and IntelliJ IDEA anchors.
minimumPlatformVersion=2025.2

# Marketplace product-family claim. Gradle verifies the latest release of every
# listed IDE, plus minimum WebStorm and IntelliJ IDEA Ultimate anchors.
advertisedProductTypes=WebStorm,IntellijIdeaUltimate,IntellijIdeaCommunity,PhpStorm,PyCharm,DataSpell,RubyMine,CLion,DataGrip,GoLand,Rider,RustRover

# Never add an implicit recommended IDE outside the explicit matrix above.
org.jetbrains.intellij.platform.verifyPluginDefaultRecommendedIdes=false

# Marketplace plugin version. Synchronized from package.json.
pluginVersion=0.0.82

# Pinned @tsrx/language-server version used by the IntelliJ plugin.
tsrxLspVersion=0.3.128
