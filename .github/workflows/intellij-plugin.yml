name: IntelliJ Plugin

on:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to verify
        required: false
        type: string
  push:
    branches: [main]
    tags: ["!**"]
    paths:
      - "packages/intellij-plugin/**"
      - "grammars/textmate/**"
      - "scripts/sync-intellij-plugin-version.js"
      - ".changeset/**"
      - ".github/workflows/intellij-plugin.yml"
  pull_request:
    paths:
      - "packages/intellij-plugin/**"
      - "grammars/textmate/**"
      - "scripts/sync-intellij-plugin-version.js"
      - ".changeset/**"
      - ".github/workflows/intellij-plugin.yml"

permissions:
  contents: read

concurrency:
  group: intellij-plugin-${{ inputs.revision || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Resolve compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Resolve advertised product targets
        id: targets
        run: echo "targets=$(node packages/intellij-plugin/scripts/verification-matrix.mjs)" >> "$GITHUB_OUTPUT"

  build:
    name: Test and build archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Verify synchronized versions
        run: node scripts/sync-intellij-plugin-version.js --check

      - name: Run platform tests
        run: packages/intellij-plugin/gradlew -p packages/intellij-plugin test

      - name: Verify project configuration
        run: packages/intellij-plugin/gradlew -p packages/intellij-plugin verifyPluginProjectConfiguration

      - name: Build plugin archive
        run: packages/intellij-plugin/gradlew -p packages/intellij-plugin buildPlugin

      - name: Verify plugin archive structure
        run: packages/intellij-plugin/gradlew -p packages/intellij-plugin verifyPluginStructure

      - name: Upload unsigned plugin archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-plugin-unsigned
          path: packages/intellij-plugin/build/distributions/*.zip
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.productType }} (${{ matrix.channel }})
    needs: [matrix, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Download tested plugin archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: intellij-plugin-unsigned
          path: release/unsigned

      - name: Verify binary compatibility
        run: |
          mapfile -t archives < <(find release/unsigned -maxdepth 1 -type f -name '*.zip')
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one tested plugin archive." >&2
            exit 1
          fi
          packages/intellij-plugin/gradlew -p packages/intellij-plugin verifyPlugin \
            "-PverificationArchiveFile=$(realpath "${archives[0]}")" \
            -PverificationProductType=${{ matrix.productType }} \
            -PverificationProductVersion=${{ matrix.productVersion }}

      - name: Upload Plugin Verifier reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-verifier-${{ matrix.slug }}
          path: packages/intellij-plugin/build/reports/pluginVerifier
          if-no-files-found: error
